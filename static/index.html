<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Subject Guide AI Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f7fb;
        }

        h1 {
            text-align: center;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        input,
        textarea,
        select,
        button {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            cursor: pointer;
            font-weight: bold;
        }

        #answer {
            white-space: pre-wrap;
            line-height: 1.6;
        }

        #sources {
            white-space: pre-wrap;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }

        .status {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>📚 Subject Guide AI Assistant</h1>

    <!-- Document Upload -->
    <div class="card">
        <h2>📄 Upload Study Material</h2>

        <label>Select PDF:</label>
        <input type="file" id="fileInput" accept=".pdf">

        <label>Subject:</label>
        <input
            type="text"
            id="subjectInput"
            placeholder="Example: C-Programming"
        >

        <label>Chapter:</label>
        <input
            type="text"
            id="chapterInput"
            placeholder="Example: Functions"
        >

        <button onclick="uploadDocument()">
            Upload Document
        </button>

        <div id="uploadStatus" class="status"></div>
    </div>

    <!-- Ask Question -->
    <div class="card">
        <h2>❓ Ask a Question</h2>

        <textarea
            id="question"
            rows="5"
            placeholder="Example: What is a function in C?"
        ></textarea>

        <button onclick="askQuestion()">
            Ask Question
        </button>
    </div>

    <!-- Answer -->
    <div class="card">
        <h2>💡 Answer</h2>

        <div id="loading" class="hidden">
            Generating answer...
        </div>

        <div id="answer">
            Your answer will appear here.
        </div>
    </div>

    <!-- Sources -->
    <div class="card">
        <h2>📚 Retrieved Sources</h2>

        <div id="sources">
            Sources will appear here.
        </div>
    </div>

<script>

async function uploadDocument() {

    const fileInput = document.getElementById("fileInput");
    const subject = document.getElementById("subjectInput").value.trim();
    const chapter = document.getElementById("chapterInput").value.trim();
    const status = document.getElementById("uploadStatus");

    if (!fileInput.files.length) {
        status.textContent = "Please select a PDF.";
        return;
    }

    if (!subject) {
        status.textContent = "Please enter a subject.";
        return;
    }

    if (!chapter) {
        status.textContent = "Please enter a chapter.";
        return;
    }

    const formData = new FormData();

    formData.append("file", fileInput.files[0]);
    formData.append("subject", subject);
    formData.append("chapter", chapter);

    status.textContent = "Uploading...";

    try {

        const response = await fetch("/upload", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (!response.ok) {
            status.textContent =
                data.detail || "Upload failed.";
            return;
        }

        status.textContent =
            "✅ Uploaded successfully: " +
            data.filename +
            " | Subject: " +
            data.subject +
            " | Chapter: " +
            data.chapter +
            " | Chunks: " +
            data.chunks_added;

    } catch (error) {

        status.textContent =
            "❌ Error connecting to server.";

        console.error(error);
    }
}


async function askQuestion() {

    const question =
        document.getElementById("question").value.trim();

    const answer =
        document.getElementById("answer");

    const sources =
        document.getElementById("sources");

    const loading =
        document.getElementById("loading");

    if (!question) {
        answer.textContent = "Please enter a question.";
        return;
    }

    loading.classList.remove("hidden");

    answer.textContent = "";
    sources.textContent = "";

    try {

        const response = await fetch("/ask", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                question: question
            })
        });

        const data = await response.json();

        if (!response.ok) {

            answer.textContent =
                data.detail || "Something went wrong.";

            return;
        }

        answer.textContent =
            data.answer;

        sources.textContent =
            data.sources
                .map(
                    source =>
                        `File: ${source.metadata.filename}
Subject: ${source.metadata.subject}
Chapter: ${source.metadata.chapter}
Distance: ${source.distance.toFixed(4)}

${source.text}`
                )
                .join("\n\n-------------------------\n\n");

    } catch (error) {

        answer.textContent =
            "❌ Unable to connect to the server.";

        console.error(error);

    } finally {

        loading.classList.add("hidden");
    }
}

</script>

</body>
</html>
