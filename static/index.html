<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Subject Guide AI Assistant
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            min-height: 100vh;

        }

        .container {

            width: 90%;

            max-width: 900px;

            margin: 50px auto;

        }

        .header {

            background: #1f2937;

            color: white;

            padding: 30px;

            border-radius: 15px;

            text-align: center;

        }

        .header h1 {

            margin: 0;

            font-size: 30px;

        }

        .header p {

            margin-top: 10px;

            color: #d1d5db;

        }

        .card {

            background: white;

            margin-top: 25px;

            padding: 25px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.08);

        }

        textarea {

            width: 100%;

            height: 120px;

            padding: 15px;

            font-size: 16px;

            border: 1px solid #ccc;

            border-radius: 10px;

            resize: vertical;

        }

        button {

            margin-top: 15px;

            width: 100%;

            padding: 14px;

            font-size: 17px;

            border: none;

            border-radius: 10px;

            background: #2563eb;

            color: white;

            cursor: pointer;

        }

        button:hover {

            background: #1d4ed8;

        }

        #loading {

            display: none;

            margin-top: 20px;

            text-align: center;

        }

        #answerBox {

            display: none;

            margin-top: 25px;

        }

        .answer {

            background: #f0fdf4;

            border-left: 5px solid #22c55e;

            padding: 20px;

            border-radius: 8px;

            line-height: 1.6;

        }

        .sources {

            margin-top: 20px;

            background: #f9fafb;

            padding: 15px;

            border-radius: 10px;

        }

        .source {

            padding: 10px;

            margin-top: 10px;

            background: white;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 14px;

        }

    </style>

</head>


<body>

<div class="container">


    <div class="header">

        <h1>
            📚 Subject Guide AI Assistant
        </h1>

        <p>
            Ask questions from your study material
        </p>

    </div>


    <div class="card">

        <textarea
            id="question"
            placeholder="Ask your question here...">
        </textarea>

        <button onclick="askQuestion()">

            Ask Question

        </button>


        <div id="loading">

            🤖 AI is thinking...

        </div>


        <div id="answerBox">

            <h2>
                Answer
            </h2>

            <div
                id="answer"
                class="answer">
            </div>


            <div class="sources">

                <h3>
                    Retrieved Sources
                </h3>

                <div id="sources">
                </div>

            </div>

        </div>

    </div>

</div>


<script>

async function askQuestion() {

    const question =
        document
        .getElementById("question")
        .value
        .trim();


    if (!question) {

        alert(
            "Please enter a question."
        );

        return;

    }


    document
        .getElementById("loading")
        .style.display = "block";


    document
        .getElementById("answerBox")
        .style.display = "none";


    try {

        const response =
            await fetch(
                "/ask",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        question: question
                    })

                }
            );


        const data =
            await response.json();


        document
            .getElementById("answer")
            .innerText =
            data.answer;


        const sources =
            document
            .getElementById("sources");


        sources.innerHTML = "";


        data.sources.forEach(
            (source, index) => {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "source";

                div.innerText =
                    "Source " +
                    (index + 1) +
                    ": " +
                    source;

                sources.appendChild(
                    div
                );

            }
        );


        document
            .getElementById("answerBox")
            .style.display = "block";


    }

    catch (error) {

        document
            .getElementById("answer")
            .innerText =
            "Error connecting to the server.";

        document
            .getElementById("answerBox")
            .style.display = "block";

    }


    document
        .getElementById("loading")
        .style.display = "none";

}

</script>


</body>

</html>
